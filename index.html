<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="page">

        <a href="index.html" class="back">←</a>

        <div class="login">

            <h2>Sign in to watch</h2>

            <form action="watch.html">

                <label>Enter your Mobile Number</label>

                <div class="phone">

                    <span>+91</span>

                    <input type="tel" name="mobile" maxlength="10" pattern="[0-9]{10}" required>

                </div>

                <button type="submit" class="btn next">

                    Next

                </button>

            </form>

            <p class="terms">

                By proceeding you confirm that you are of 18 years or above<br>

                and accept the

                <a href="#">Terms of Use</a> &

                <a href="#">Privacy Policy</a>.

            </p>

            <p class="account">Already have an account?</p>

            <a href="https://accounts.google.com/" target="_blank" class="google-login">

                Sign In via Email ID or Social Media

            </a>

        </div>

        <div class="dots">

            <b></b>

            <i></i>

            <i></i>

            <i></i>

        </div>

    </div>

</body>

</html>
